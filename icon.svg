<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Layer Tools</title>
  <defs>
    <!-- open-end jaw: a square notch cut into the wrench head -->
    <mask id="jaw" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <rect x="28.4" y="1" width="7.2" height="15" fill="#000"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#1d2024" stroke="#2c3036" stroke-width="2"/>
  <!-- hammer: head top-left, handle to bottom-right -->
  <g transform="rotate(-45 32 32)" fill="#f2b33d">
    <rect x="29.5" y="19" width="5" height="38" rx="2.5"/>
    <path d="M21 9.5 h22 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-22 l-5 -2 v-8 z"/>
  </g>
  <!-- wrench: jaw top-right, handle to bottom-left; dark outline separates it where it crosses the hammer -->
  <g transform="rotate(45 32 32)" fill="#1d2024" stroke="#1d2024" stroke-width="5" stroke-linejoin="round" mask="url(#jaw)">
    <rect x="29" y="20" width="6" height="36" rx="3"/>
    <circle cx="32" cy="15.5" r="9.5"/>
  </g>
  <g transform="rotate(45 32 32)" fill="#f2b33d" mask="url(#jaw)">
    <rect x="29" y="20" width="6" height="36" rx="3"/>
    <circle cx="32" cy="15.5" r="9.5"/>
  </g>
</svg>
